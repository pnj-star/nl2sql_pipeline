[project]
name = "nl2sql-skill"
version = "0.1.0"
description = "NL2SQL pipeline skill for MySQL, built on common_core."
requires-python = ">=3.11"
dependencies = [
  "common-core[llm,cache]>=0.1.0,<0.2",
  "sqlglot>=23.0",
]

[project.optional-dependencies]
sql = ["pymysql>=1.1"]
semantic = ["pyyaml>=6.0"]
mcp = ["mcp>=1.2,<2"]
test = ["pytest>=8.0"]

[project.scripts]
nl2sql-skill-mcp = "nl2sql_skill.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql_skill"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
