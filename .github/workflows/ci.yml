name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install common-core from sibling repo
        run: |
          git clone --depth 1 https://github.com/pnj-star/retrieve_pipeline.git /tmp/common_core_repo
          pip install -e /tmp/common_core_repo/common_core --no-deps || echo "WARN: common_core not found in repo"

      - name: Install dependencies
        run: |
          pip install -e ".[test,sql,semantic]" --no-deps
          pip install sqlglot pyyaml pytest pymysql

      - name: Run tests
        run: pytest tests/ -v --tb=short
